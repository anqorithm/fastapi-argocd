name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Push and deploy need the microk8s registry on the local machine; Argo CD syncs k8s/ from git.
      - name: Build image
        run: docker build -t fastapi-argocd:ci .
